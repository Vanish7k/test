<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ebe7dd">
<meta name="description" content="一款安静、专注的网页数独，适配手机与桌面。">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="数独">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>数独 · Paper Sudoku</title>
<link rel="stylesheet" href="styles.css">
<style>
.app-loader{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;background:radial-gradient(900px 620px at 50% -16%,#fffaee 0%,rgba(255,250,238,0) 58%),radial-gradient(720px 520px at 94% 108%,#f2e5cf 0%,rgba(242,229,207,0) 62%),#ebe7dd;transition:opacity .45s ease,visibility .45s ease}
.app-loader[hidden]{display:flex!important;opacity:0;visibility:hidden;pointer-events:none}
.loader-grid{display:grid;grid-template-columns:repeat(3,22px);grid-template-rows:repeat(3,22px);gap:3px;padding:8px;border-radius:10px;background:rgba(255,252,244,.75);box-shadow:0 1px 0 rgba(0,0,0,.04),0 2px 10px rgba(180,169,143,.18)}
.loader-grid .lc{display:grid;place-items:center;font-family:"Iowan Old Style","Palatino Linotype","Songti SC","Noto Serif SC",Georgia,serif;font-size:13px;font-weight:600;color:#b45a2f;background:#fffcf4;border-radius:3px;opacity:0;transform:scale(.3);animation:loader-cell-pop .42s cubic-bezier(.2,1.3,.4,1) forwards}
@keyframes loader-cell-pop{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.18)}100%{opacity:1;transform:scale(1)}}
.loader-grid .lc:nth-child(1){animation-delay:0s}.loader-grid .lc:nth-child(2){animation-delay:.07s}.loader-grid .lc:nth-child(3){animation-delay:.14s}.loader-grid .lc:nth-child(4){animation-delay:.21s}.loader-grid .lc:nth-child(5){animation-delay:.28s}.loader-grid .lc:nth-child(6){animation-delay:.35s}.loader-grid .lc:nth-child(7){animation-delay:.42s}.loader-grid .lc:nth-child(8){animation-delay:.49s}.loader-grid .lc:nth-child(9){animation-delay:.56s}
.loader-brands{display:flex;flex-direction:column;align-items:center;gap:2px;opacity:0;animation:loader-fade-in .6s ease .7s forwards}
.loader-brands .lb-cn{font-family:"Iowan Old Style","Songti SC","Noto Serif SC",serif;font-size:15px;font-weight:600;letter-spacing:.18em;color:#3f3a30}
.loader-brands .lb-en{font-size:9px;letter-spacing:.32em;color:#9c9079;text-transform:uppercase}
@keyframes loader-fade-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
  <div class="app-loader" id="appLoader" aria-hidden="false">
    <div class="loader-grid">
      <div class="lc">5</div><div class="lc">3</div><div class="lc">9</div>
      <div class="lc">2</div><div class="lc">7</div><div class="lc">1</div>
      <div class="lc">8</div><div class="lc">4</div><div class="lc">6</div>
    </div>
    <div class="loader-brands">
      <span class="lb-cn">数独</span>
      <span class="lb-en">Paper Sudoku</span>
    </div>
  </div>
  <script>
    (function () {
      var el = document.getElementById('appLoader');
      if (!el) return;
      var done = false;
      function hide() {
        if (done) return;
        done = true;
        el.setAttribute('hidden', '');
        setTimeout(function () { el.parentNode && el.parentNode.removeChild(el); }, 800);
      }
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { hide(); return; }
      var t0 = Date.now();
      function ready() { setTimeout(hide, Math.max(0, 800 - (Date.now() - t0))); }
      if (document.readyState !== 'loading') ready();
      else document.addEventListener('DOMContentLoaded', ready, { once: true });
      setTimeout(hide, 3000);
    })();
  </script>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-cn">数独</span>
        <span class="brand-en">Paper Sudoku</span>
      </div>
      <div class="top-actions">
        <button class="pill-btn" id="newBtn" type="button">新游戏</button>
        <a class="pill-btn game-link" href="2048.html" aria-label="切换到 2048 游戏">2048</a>
        <button class="icon-btn" id="leaderBtn" type="button" aria-label="排行榜" title="排行榜">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9h12v9a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3V9Z"/><path d="M9 3v6M15 3v6M5 7h14"/></svg>
        </button>
        <button class="icon-btn" id="pauseBtn" type="button" aria-label="暂停" title="暂停">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg>
        </button>
      </div>
    </header>

    <section class="status" aria-label="游戏状态">
      <div class="stat"><span class="stat-label">难度</span><span class="stat-value accent" id="diffChip">简单</span></div>
      <div class="stat"><span class="stat-label">时间</span><span class="stat-value" id="timer">00:00</span></div>
      <div class="stat"><span class="stat-label">错误</span><span class="stat-value" id="mistakes">0</span></div>
      <div class="stat"><span class="stat-label">提示</span><span class="stat-value" id="hintsLeft">3</span></div>
    </section>

    <section class="board-wrap" aria-label="棋盘区域">
      <div class="board" id="board" role="grid" aria-label="数独棋盘，9 行 9 列"></div>

      <div class="overlay" id="pauseOverlay" hidden>
        <div class="overlay-card">
          <p class="eyebrow">PAUSED</p>
          <p class="overlay-title">已暂停</p>
          <p class="overlay-sub">计时已停止，回来继续解题。</p>
          <button class="primary-btn" id="resumeBtn" type="button">继续游戏</button>
        </div>
      </div>

      <div class="overlay" id="winOverlay" hidden>
        <div class="overlay-card win-card">
          <p class="eyebrow">SOLVED</p>
          <p class="overlay-title">解出来了</p>
          <div class="win-stats" id="winStats"></div>
          <p class="win-best" id="winBest" hidden>新的最佳纪录</p>
          <p class="win-rank" id="winRank" hidden></p>
          <div class="win-global" id="winGlobal" hidden>
            <div class="win-global-row">
              <input class="nick-input" id="winNick" type="text" maxlength="12" autocomplete="off" placeholder="昵称（2-12 字）" />
              <button class="ghost-btn" id="winSubmitBtn" type="button">提交全球榜</button>
            </div>
            <p class="win-global-msg" id="winGlobalMsg" hidden></p>
          </div>
          <div class="win-actions">
            <button class="primary-btn" id="winNewBtn" type="button">再来一局</button>
            <button class="ghost-btn" id="winShareBtn" type="button">分享成绩</button>
            <button class="ghost-btn" id="winCloseBtn" type="button">看看棋盘</button>
          </div>
        </div>
      </div>
    </section>

    <div class="missing" id="missingBar" aria-label="当前格子所在行、列、宫的缺失数字" hidden>
      <div class="missing-item" id="missingRowItem"><span class="missing-k">行</span><span class="missing-v" id="missingRow"></span></div>
      <div class="missing-item" id="missingColItem"><span class="missing-k">列</span><span class="missing-v" id="missingCol"></span></div>
      <div class="missing-item" id="missingBoxItem"><span class="missing-k">宫</span><span class="missing-v" id="missingBox"></span></div>
    </div>

    <section class="tools" aria-label="工具">
      <button class="tool" id="undoBtn" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a6 6 0 0 1 0 12h-1"/></svg>
        <span>撤销</span>
      </button>
      <button class="tool" id="eraseBtn" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
        <span>擦除</span>
      </button>
      <button class="tool" id="notesBtn" type="button" aria-pressed="false">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4l10.5-10.5a2.8 2.8 0 0 0-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg>
        <span>笔记</span>
      </button>
      <button class="tool" id="hintBtn" type="button">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.4 10.9c.6.4 1 1.1 1 1.8V16h4.8v-.3c0-.7.4-1.4 1-1.8A6 6 0 0 0 12 3Z"/></svg>
        <span>提示</span>
        <span class="tool-badge" id="hintBadge">3</span>
      </button>
    </section>

    <section class="pad" id="pad" aria-label="数字键盘"></section>

    <p class="tip">点击格子后输入数字 · 开启“笔记”记录候选数 · 键盘 1–9 同样可用</p>
  </main>

  <div class="sheet-backdrop" id="newOverlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="newTitle">
      <div class="sheet-grabber" aria-hidden="true"></div>
      <h2 id="newTitle">新游戏</h2>
      <p class="sheet-sub">选择难度，开始一局新的数独。</p>
      <div class="diff-list" id="diffList"></div>
      <div class="sheet-actions">
        <button class="ghost-btn" id="cancelNewBtn" type="button">继续当前</button>
        <button class="primary-btn" id="startNewBtn" type="button">开始</button>
      </div>
    </div>
  </div>

  <div class="sheet-backdrop" id="leaderOverlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="leaderTitle">
      <div class="sheet-grabber" aria-hidden="true"></div>
      <div class="leader-head">
        <h2 id="leaderTitle">排行榜</h2>
        <p class="sheet-sub" id="leaderSub">按用时从快到慢，每个难度取前 10</p>
      </div>
      <div class="leader-games" id="leaderGames" role="tablist" aria-label="游戏">
        <button class="game-tab active" data-game="sudoku" type="button" role="tab" aria-selected="true">数独</button>
        <button class="game-tab" data-game="2048" type="button" role="tab" aria-selected="false">2048</button>
      </div>
      <div class="leader-scope" id="leaderScope" role="tablist" aria-label="榜单范围">
        <button class="scope-btn active" data-scope="local" type="button" role="tab" aria-selected="true">本机</button>
        <button class="scope-btn" data-scope="global" type="button" role="tab" aria-selected="false" id="scopeGlobalBtn">全球</button>
      </div>
      <div class="nick-row" id="nickRow" hidden>
        <label class="nick-label" for="nickInput">昵称</label>
        <input class="nick-input" id="nickInput" type="text" maxlength="12" autocomplete="off" placeholder="2-12 个字符" />
        <button class="ghost-btn nick-save" id="nickSaveBtn" type="button">保存</button>
      </div>
      <div class="leader-tabs" id="leaderTabs" role="tablist" aria-label="难度"></div>
      <div class="leader-list" id="leaderList" role="list" aria-live="polite"></div>
      <p class="leader-empty" id="leaderEmpty" hidden>还没有记录，完成一局来上榜吧</p>
      <div class="sheet-actions leader-actions">
        <button class="ghost-btn" id="leaderClearBtn" type="button">清空当前难度</button>
        <button class="primary-btn" id="leaderCloseBtn" type="button">关闭</button>
      </div>
    </div>
  </div>

  <div class="update-bar" id="updateBar" hidden>
    <span class="update-text">有新版本可用</span>
    <button class="update-btn" id="updateBtn" type="button">刷新</button>
    <button class="update-close" id="updateDismiss" type="button" aria-label="稍后再说">×</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <p class="sr-only" id="live" aria-live="polite"></p>

  <script src="js/config.js"></script>
  <script src="js/sudoku.js"></script>
  <script src="js/remote.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
