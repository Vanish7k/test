<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ebe7dd">
<meta name="description" content="纸感 2048，滑动合并数字，支持撤销与最高分记录。">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>2048 · Paper</title>
<link rel="stylesheet" href="2048.css">
<style>
.app-loader{position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:radial-gradient(1200px 600px at 50% -10%,#f6f1e6 0%,transparent 60%),#ebe7dd;transition:opacity .45s ease,visibility .45s ease}
.app-loader[hidden]{display:flex!important;opacity:0;visibility:hidden;pointer-events:none}
.loader-tile{position:relative;width:62px;height:62px;border-radius:8px;background:#eee4da;color:#776e65;display:grid;place-items:center;font-family:"Helvetica Neue",Arial,sans-serif;font-weight:700;letter-spacing:-.02em;box-shadow:0 1px 0 rgba(0,0,0,.05),0 3px 12px rgba(119,110,101,.18);animation:loader-tile-cycle 1.05s ease forwards}
@keyframes loader-tile-cycle{0%{background:#eee4da;color:#776e65}8%{background:#ede0c8;color:#776e65}16%{background:#f2b179;color:#f9f6f2}24%{background:#f59563;color:#f9f6f2}32%{background:#f67c5f;color:#f9f6f2}40%{background:#f65e3b;color:#f9f6f2}48%{background:#edcf72;color:#f9f6f2;font-size:26px}56%{background:#edcc61;color:#f9f6f2;font-size:24px}64%{background:#edc850;color:#f9f6f2;font-size:22px}72%{background:#edc53f;color:#f9f6f2;font-size:20px}80%{background:#edc22e;color:#f9f6f2;font-size:18px}92%{transform:scale(1)}100%{transform:scale(1.02)}}
.loader-tile::after{content:"2048";position:absolute;inset:0;display:grid;place-items:center;font-size:18px;opacity:0;transform:scale(.7);animation:loader-text-pop .28s cubic-bezier(.2,1.4,.4,1) .82s forwards}
@keyframes loader-text-pop{0%{opacity:0;transform:scale(.7)}60%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
.loader-brand{font-size:9px;letter-spacing:.34em;color:#9c9079;text-transform:uppercase;opacity:0;animation:loader-brand-fade .5s ease 1.1s forwards}
@keyframes loader-brand-fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="app-loader" id="appLoader" aria-hidden="false">
  <div class="loader-tile" aria-label="加载中"></div>
  <div class="loader-brand">paper · 2048</div>
</div>
<script>
  (function () {
    var el = document.getElementById('appLoader');
    if (!el) return;
    var done = false;
    function hide() {
      if (done) return;
      done = true;
      el.setAttribute('hidden', '');
      setTimeout(function () { el.parentNode && el.parentNode.removeChild(el); }, 800);
    }
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { hide(); return; }
    var t0 = Date.now();
    function ready() { setTimeout(hide, Math.max(0, 800 - (Date.now() - t0))); }
    if (document.readyState !== 'loading') ready();
    else document.addEventListener('DOMContentLoaded', ready, { once: true });
    setTimeout(hide, 3000);
  })();
</script>
<main class="game">
  <header class="bar">
    <a class="back" href="index.html" aria-label="返回数独">←<span class="back-text"> 数独</span></a>
    <div class="scores">
      <div class="score"><span class="k">得分</span><strong id="score">0</strong></div>
      <div class="score"><span class="k">最高</span><strong id="best">0</strong></div>
    </div>
    <div class="actions">
      <button class="round" id="undoBtn" type="button" aria-label="撤销上一步" title="撤销">↺</button>
      <button class="round" id="lbBtn" type="button" aria-label="排行榜" title="排行榜">🏆</button>
      <button class="round wide" id="endBtn" type="button" aria-label="结束当前这一局" title="结束这一局">结束</button>
    </div>
  </header>

  <section class="board-wrap">
    <div class="board" id="board" role="application" aria-label="2048 棋盘，滑动或使用方向键移动数字">
      <div class="cells" id="cells" aria-hidden="true"></div>
      <div class="tiles" id="tiles"></div>
      <div class="overlay" id="overlay" hidden>
        <div class="ov-card">
          <p class="ov-title" id="overlayTitle"></p>
          <p class="ov-sub" id="overlaySub"></p>
          <div class="ov-actions">
            <button class="ghost" id="keepBtn" type="button" hidden>继续玩</button>
            <button class="primary" id="againBtn" type="button">再来一局</button>
          </div>
          <div class="ov-global" id="ovGlobal" hidden>
            <input class="ov-nick" id="ovNick" type="text" maxlength="12" autocomplete="off" placeholder="昵称（2-12 字）" />
            <button class="ov-submit" id="ovSubmit" type="button">提交全球榜</button>
            <p class="ov-msg" id="ovMsg" hidden></p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <p class="tip">滑动屏幕或按方向键移动 · 相同数字合并</p>
</main>

<div class="lb" id="lb" hidden>
  <div class="lb-card" role="dialog" aria-modal="true" aria-labelledby="lbTitle">
    <header class="lb-head">
      <div>
        <h2 class="lb-title" id="lbTitle">2048 排行榜</h2>
        <p class="lb-sub" id="lbSub">本机前 10 名</p>
      </div>
      <button class="lb-close" id="lbClose" type="button" aria-label="关闭排行榜">×</button>
    </header>

    <div class="lb-scopes" role="tablist" aria-label="排行榜范围">
      <button class="lb-scope is-active" id="lbLocal" type="button" role="tab" aria-selected="true">本机</button>
      <button class="lb-scope" id="lbGlobal" type="button" role="tab" aria-selected="false">全球</button>
    </div>

    <p class="lb-msg" id="lbMsg" hidden></p>
    <ol class="lb-list" id="lbList"></ol>
    <p class="lb-empty" id="lbEmpty" hidden>还没有记录</p>
    <p class="lb-note" id="lbNote" hidden>结束一局后，在结算面板填写昵称即可提交全球榜。</p>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/remote.js"></script>
<script src="js/2048.js"></script>
</body>
</html>
